<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClassFabric</title>
    <meta name="description" content="ClassFabric 是基于 ClassIsland 的社区增强版课表信息显示工具,面向班级多媒体屏幕,开源(GPL-3.0)。" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClassFabric" />
    <meta property="og:title" content="ClassFabric" />
    <meta property="og:image" content="https://cf.ansoukin.top/logo-384.png" />
    <meta property="og:description" content="适用于班级多媒体屏幕的课表信息显示工具,基于 ClassIsland 的社区增强版。" />
    <meta property="og:url" content="https://cf.ansoukin.top/" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://cf.ansoukin.top/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/logo-384.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var m = localStorage.getItem('cf-theme') || 'system'
        var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ClassFabric",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Windows",
        "url": "https://cf.ansoukin.top/",
        "license": "https://www.gnu.org/licenses/gpl-3.0.html",
        "codeRepository": "https://github.com/Ansoukin/ClassFabric"
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
